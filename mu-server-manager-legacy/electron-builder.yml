appId: com.devfrostty.servermanager.legacy
productName: Server Manager Legacy
copyright: Copyright © 2026 Dev-Frostty

# Diretórios
directories:
  output: release
  buildResources: build

# Arquivos a incluir no build
files:
  - dist/**/*
  - electron/**/*
  - native/**/*.node
  - package.json
  - node_modules/**/*

# Arquivos a excluir do build (otimização)
asarUnpack:
  - native/**/*

# Configurações do Windows
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: msi
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-${version}-Setup.${ext}
  sign: false
  signingHashAlgorithms: []  # Desabilita completamente assinatura
  legalTrademarks: "Server Manager by Dev-Frostty"
  requestedExecutionLevel: "asInvoker"
  
# Configurações do instalador NSIS (Windows)
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ${productName}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  license: LICENSE.txt

# Configurações do instalador MSI (Windows - mais confiável)
msi:
  createDesktopShortcut: true
  createStartMenuShortcut: true
  perMachine: false
  oneClick: false

# Compressão (store = sem compressão para addons nativos)
compression: normal

# Configurações de publicação (desabilitadas por padrão)
publish: null
