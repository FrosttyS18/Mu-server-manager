appId: com.devfrostty.servermanager.modern
productName: Server Manager Modern
copyright: Copyright © 2026 Dev-Frostty
disableSanityCheckAsar: true

# Diretórios
directories:
  output: dist-electron
  buildResources: build

# Arquivos a incluir no build (otimizado - apenas produção)
# NOTA: Não especificar node_modules aqui faz o electron-builder incluir
# automaticamente apenas as production dependencies (exclui devDependencies)
files:
  - dist/**/*
  - electron/**/*
  - native/**/*.node
  - package.json
  # Exclui arquivos desnecessários mesmo das production dependencies
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/{test,__tests__,tests,example,examples,demo,docs,doc}"
  - "!**/{README.md,CHANGELOG.md,LICENSE,*.txt}"
  - "!**/.{git,github,DS_Store}"

# Arquivos a excluir do build (otimização)
asarUnpack:
  - native/**/*

# Configurações do Windows
win:
  target:
    - target: msi
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-${version}-Setup.${ext}
  sign: false
  legalTrademarks: "Server Manager by Dev-Frostty"
  requestedExecutionLevel: "asInvoker"
  verifyUpdateCodeSignature: false
  signtoolOptions:
    signingHashAlgorithms: ['sha256']
    publisherName: "Dev-Frostty"
  
# Configurações do instalador MSI (Windows - mais confiável)
msi:
  createDesktopShortcut: true
  createStartMenuShortcut: true
  perMachine: false
  oneClick: false
  runAfterFinish: true
  upgradeCode: "B4C7D8E9-F1A2-3B4C-5D6E-7F8A9B0C1D2E"
  warningsAsErrors: false

# Configurações do Portable
portable:
  artifactName: ${productName}-${version}-portable.${ext}

# Compressão (maximum = máxima compressão para reduzir tamanho)
compression: maximum

# Configurações de publicação (desabilitadas por padrão)
publish: null
