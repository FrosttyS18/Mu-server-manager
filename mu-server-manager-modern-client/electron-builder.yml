appId: com.devfrostty.servermanager.modern
productName: Server Manager Modern
copyright: Copyright © 2026 Dev-Frostty

# Diretórios
directories:
  output: release-client
  buildResources: build

# Arquivos a incluir no build
files:
  - dist/**/*
  - electron/**/*
  - native/**/*.node
  - package.json
  - node_modules/**/*

# Arquivos a excluir do build (otimização)
asarUnpack:
  - native/**/*

# Configurações do Windows
win:
  target:
    - target: msi
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-${version}-Setup.${ext}
  sign: false
  legalTrademarks: "Server Manager by Dev-Frostty"
  requestedExecutionLevel: "asInvoker"
  verifyUpdateCodeSignature: false
  signtoolOptions:
    signingHashAlgorithms: ['sha256']
    publisherName: "Dev-Frostty"
  
# Configurações do instalador MSI (Windows - mais confiável)
msi:
  createDesktopShortcut: true
  createStartMenuShortcut: true
  perMachine: false
  oneClick: false
  runAfterFinish: true
  upgradeCode: "B4C7D8E9-F1A2-3B4C-5D6E-7F8A9B0C1D2E"
  warningsAsErrors: false

# Compressão (store = sem compressão para addons nativos)
compression: normal

# Configurações de publicação (desabilitadas por padrão)
publish: null
